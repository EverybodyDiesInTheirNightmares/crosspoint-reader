name: x4c personal build

# Personal-fork build for the reading-stats feature: only the x4c target,
# triggered manually (push events on forks need one-time Actions consent).
# Steps mirror .github/workflows/ci.yml, including the pioarduino core pin
# workaround for https://github.com/pioarduino/platform-espressif32/issues/529.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x4c:
    name: Build x4c firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-x4c-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-v3-${{ runner.os }}-x4c-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Keep the penv core on the same version as the outer core installed
          # above (see ci.yml and platform-espressif32#529).
          pio pkg install -e x4c
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build x4c firmware
        run: |
          set -euo pipefail
          pio run -e x4c | tee pio.log

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-x4c
          path: .pio/build/x4c/firmware.bin
          if-no-files-found: error
